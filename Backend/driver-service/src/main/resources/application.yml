spring:
  application:
    name: driver-service
  cloud:
    openfeign:
      client:
        config:
          "RIDE-SERVICE":
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goryde_driver?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
