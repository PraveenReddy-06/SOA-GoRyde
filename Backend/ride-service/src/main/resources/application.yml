spring:
  application:
    name: ride-service

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

      client:
        config:
          "DRIVER-SERVICE":
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goryde_ride?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

ride:
  fare:
    base: ${RIDE_FARE_BASE:5.00}
    per-km: ${RIDE_FARE_PER_KM:1.50}
    per-minute: ${RIDE_FARE_PER_MINUTE:0.25}
  estimated-duration-minutes-per-km: ${RIDE_ESTIMATED_MINUTES_PER_KM:3}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
